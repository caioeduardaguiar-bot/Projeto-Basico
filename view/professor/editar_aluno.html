{% extends "professor/base_professor.html" %}

{% block title %}Editar Aluno{% endblock %}
{% block page_title %}Editar Aluno{% endblock %}
{% block page_subtitle %}Atualize os dados cadastrais do aluno{% endblock %}

{% block styles %}
<style>
    .form-container { background: var(--branco); padding: 30px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 800px; margin: 0 auto; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }
    
    .form-group { margin-bottom: 20px; }
    .form-label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--cor-menu-bg); }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 1rem; }
    .form-control:focus { outline: none; border-color: var(--cor-destaque); }
    
    .btn-submit { background: var(--cor-destaque); color: white; padding: 12px 25px; border: none; border-radius: 5px; cursor: pointer; font-size: 1rem; font-weight: bold; }
    .btn-voltar { background: #95a5a6; color: white; padding: 12px 25px; border: none; border-radius: 5px; text-decoration: none; display: inline-block; font-weight: bold; }
    .actions { margin-top: 20px; display: flex; gap: 15px; justify-content: flex-end; }
</style>
{% endblock %}

{% block content %}
<div class="form-container">
    <form method="POST">
        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="nome_completo" class="form-control" value="{{ aluno.nome_completo }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Apelido</label>
                <input type="text" name="apelido" class="form-control" value="{{ aluno.apelido }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" value="{{ aluno.email }}" required>
            </div>

            <div class="form-group">
                <label class="form-label">Telefone</label>
                <input type="text" name="telefone" class="form-control" value="{{ aluno.telefone }}">
            </div>

            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" name="senha" class="form-control" value="{{ aluno.senha }}" required> 
            </div>
            
            <div class="form-group">
                <label class="form-label">Tipo de Usuário</label>
                <select name="tipo" class="form-control">
                    <option value="aluno" {% if aluno.tipo == 'aluno' %}selected{% endif %}>Aluno</option>
                    <option value="professor" {% if aluno.tipo == 'professor' %}selected{% endif %}>Professor</option>
                </select>
            </div>
        </div>

        <div class="actions">
            <a href="{{ url_for('listaluno') }}" class="btn-voltar">Cancelar</a>
            <button type="submit" class="btn-submit">Salvar Alterações</button>
        </div>
    </form>
</div>
{% endblock %}
