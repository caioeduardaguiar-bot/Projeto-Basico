{% extends "usuario/base_publico.html" %}

{% block title %}Login - EduConnect{% endblock %}

{% block styles %}
<style>
    .auth-card {
        background: white; padding: 40px; border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px;
    }
    .auth-header { text-align: center; margin-bottom: 30px; }
    .auth-header i { font-size: 3rem; color: var(--azul-secundario); margin-bottom: 10px; }
    .form-group { margin-bottom: 20px; }
    .form-control { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; }
    .btn-login { width: 100%; padding: 12px; background: var(--azul-secundario); color: white; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }
    .btn-login:hover { background: var(--azul-hover); }
</style>
{% endblock %}

{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <i class="fas fa-user-circle"></i>
        <h2>Acesse sua conta</h2>
    </div>

    <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
            <input type="text" name="usuario" class="form-control" placeholder="Usuário / Apelido" required>
        </div>
        <div class="form-group">
            <input type="password" name="senha" class="form-control" placeholder="Senha" required>
        </div>
        <button type="submit" class="btn-login">Entrar</button>
    </form>

    <div style="text-align: center; margin-top: 20px;">
        <p>Não tem conta? <a href="{{ url_for('cadastro') }}" style="color: var(--azul-secundario); font-weight: bold;">Cadastre-se aqui</a></p>
    </div>
</div>
{% endblock %}
